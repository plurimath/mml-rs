name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  RUST_BACKTRACE: 1
  # Code generated at lutaml-rs#9/#10 inlines the recursive field frames, so a
  # debug test thread overflows the default 2 MiB stack on over-under-019.
  RUST_MIN_STACK: 268435456

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
          # Oldest supported toolchain: the pinned moxml-rs revision (via lutaml-rs)
          # uses u64::is_multiple_of, stable since Rust 1.87.
          - os: ubuntu-latest
            rust: 1.87.0
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo +${{ matrix.rust }} fmt --all -- --check
      - name: cargo test --locked --all-targets
        run: cargo +${{ matrix.rust }} test --locked --all-targets
      - name: cargo test --locked --all-features --all-targets
        # The generated v3 and v4 models are very large; compiling the library and its
        # test build in parallel exhausted runner memory on the oldest toolchain.
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo +${{ matrix.rust }} test --locked --all-features --all-targets
      - name: cargo test --locked --manifest-path native/Cargo.toml --all-targets
        run: cargo +${{ matrix.rust }} test --locked --manifest-path native/Cargo.toml --all-targets

      # Pinned plurimath-testsuite mathml generation 3: the same commit and
      # generation the Ruby gem's corpus workflow replays.
      - name: Check out the pinned mathml generation 3 corpus
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: plurimath/plurimath-testsuite
          ref: 674126a07fa1cf89c24bc50fadb305299e1d1b18
          path: .corpus
          persist-credentials: false
      - name: Install Python for the corpus extractor
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify and extract the pinned generation
        run: |
          python -m pip install PyYAML==6.0.2
          python .github/scripts/extract-corpus.py .corpus tests/fixtures/corpus-pin.json target/corpus.json
      - name: Replay pinned generation 3 (model-roundtrip rows)
        env:
          MML_CORPUS_CASES: target/corpus.json
          MML_CORPUS_REPORT: target/corpus-report.json
        run: cargo +${{ matrix.rust }} test --locked --test corpus_replay -- --ignored --nocapture
      - name: Upload the replay report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-report-${{ matrix.os }}-${{ matrix.rust }}
          path: target/corpus-report.json
          if-no-files-found: ignore
