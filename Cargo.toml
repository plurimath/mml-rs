[package]
name = "mml-rs"
version = "0.1.0"
repository = "https://github.com/plurimath/mml-rs"
edition = "2021"
description = "Generated MathML v3 and v4 models and native XML codecs"
license = "BSD-2-Clause"
readme = "README.md"
include = ["src/lib.rs", "src/ruby_xml.rs", "src/v3.rs", "src/v4.rs", "src/generated_xml/*/models.rs", "src/generated_xml/*/xml_codecs.rs", "model/**", "tests/**", "README.md", "Cargo.toml"]

[features]
default = ["v3"]
v3 = []
v4 = []
model-serde = []

[dependencies]
# TEMPORARY fork pin (lutaml/lutaml-rs#10 head): pin to lutaml merge commit once lutaml-rs#10 / lutaml-ts#3 land.
lutaml-rs = { version = "=0.1.0", git = "https://github.com/suleman-uzair/lutaml-rs", rev = "828275bd28facc7af8caf5c0fa402ec6962369df", default-features = false, features = ["xml"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision", "preserve_order"] }
